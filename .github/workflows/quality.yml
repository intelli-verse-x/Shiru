name: Quality Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.1'
  PNPM_VERSION: '12.17.0'

jobs:
  check:
    name: Lint, Type Check, and Svelte Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Check isolated metadata migration regressions
        run: node --test test/sync-migration.test.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Checks
        run: pnpm check

      - name: Compile desktop bundles without packaging or publishing
        run: pnpm --dir electron run web:build
